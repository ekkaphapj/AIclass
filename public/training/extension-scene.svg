<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480"><rect width="700" height="480" fill="#faf5e9"/><g font-family="sans-serif" fill="#463923"><text x="25" y="40" font-size="24">S1/S2 ภาพแผนผังที่เกิดเหตุจำลองเพื่อการฝึก</text><rect x="40" y="75" width="390" height="280" fill="none" stroke="#463923" stroke-width="4"/><rect x="70" y="180" width="200" height="50" fill="#c3b79c"/><text x="85" y="213" font-size="20">เคาน์เตอร์</text><text x="70" y="265" font-size="18">จุดวางกระเป๋าตาม W1</text><text x="70" y="320" font-size="20">หน้าร้าน</text><path d="M430 90v80" stroke="#faf5e9" stroke-width="10"/><text x="330" y="115" font-size="18">ประตูหลัง</text><rect x="460" y="75" width="200" height="280" fill="#e1d8bf"/><text x="480" y="200" font-size="20">ลานส่งของ</text><text x="455" y="330" font-size="18">ทางเดินออก ↓</text><text x="35" y="395" font-size="18">จากร้าน: แยกตะวันออก 500 ม. • ตลาด 800 ม. • คลัง 2 กม.</text><text x="35" y="440" font-size="18">ไม่ใช่ภาพถ่ายจริง • ไม่แสดงผู้หยิบทรัพย์ • แผนผังไม่ตามมาตราส่วน</text></g></svg>
